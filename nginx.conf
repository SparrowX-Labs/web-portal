server {
    listen 8080;
    server_name _;
    server_tokens off;
    default_type application/json;

    # The Gateway API fallback route marks unknown API requests explicitly.
    # Keeping this at server scope so it also catches paths that look like static
    # assets before NGINX selects a more-specific location.
    if ($http_x_sparrowx_api_error = "true") {
        return 404 '{"error":"API endpoint not found","source":"gateway-api-fallback"}';
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Health endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # The portal currently has no URL-based client-side routes. Serve the
    # application only at its supported root path.
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }

    # Return an HTML error page for unsupported frontend paths when the
    # Gateway fallback header is not present.
    location / {
        root /usr/share/nginx/html;
        error_page 404 =404 /404.html;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
